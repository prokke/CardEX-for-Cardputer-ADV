; CardEX - File Manager & Text Editor for M5Stack Cardputer ADV
;
; Target: M5Stack Cardputer ADV (Stamp-S3A / ESP32-S3FN8, 8MB flash, no PSRAM)
;
; IMPORTANT: M5Cardputer >= 1.2.0 is required and the tag is pinned on purpose.
; The keyboard API changed incompatibly between 1.1.x and 1.2.0: when Fn is held,
; updateKeysState() returns early and leaves KeysState::word empty, and `del`
; moved from plain Backspace to Fn+Backspace. src/Input.cpp works around this by
; reading Keyboard::keyList() directly, but the raw key map it relies on still
; belongs to the library - do not float this dependency.

[platformio]
name = CardEX
default_envs = cardputer-adv
src_dir = src

[env]
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-missing-field-initializers

; ==================== FIRMWARE ====================
[env:cardputer-adv]
platform = espressif32@^7.1.0
framework = arduino
board = m5stack-stamps3
board_build.partitions = default_8MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; M5Cardputer 1.2.0 is not published to the PlatformIO registry (it only carries
; 1.1.1), so the tag is pulled straight from GitHub.
lib_deps =
    https://github.com/m5stack/M5Cardputer.git#1.2.0
; The stamps3 board definition hardcodes ARDUINO_USB_MODE=1 (hardware CDC/JTAG).
; USB Mass Storage needs the TinyUSB stack, which is only built with USB_MODE=0.
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1

; ==================== HOST TESTS ====================
; Unit tests for the pure path/format helpers that guard every destructive file
; operation. PathUtils.cpp is deliberately free of Arduino headers so it can be
; compiled here; build_src_filter keeps the rest of src/ out of this build.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<PathUtils.cpp>
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -I src
